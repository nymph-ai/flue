packages: [packages/*, examples/*, apps/*, demo]
allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  braintrust: false
  core-js-pure: false
  esbuild: false
  msgpackr-extract: true
  node-liblzma: false
  protobufjs: false
  # Required by Astro support in apps/www.
  sharp: true
  workerd: false
minimumReleaseAge: 0
resolutionMode: highest
minimumReleaseAgeExclude:
  # The internal registry gateway omits the "time" metadata field, so the
  # release-age gate cannot evaluate this scope and fails resolution instead.
  - '@cloudflare/*'
  # The Cloudflare toolchain releases in same-day lockstep (@cloudflare/vite-plugin
  # peers on the wrangler released with it, which pins workerd/miniflare exactly),
  # so the gate would tear paired versions apart; the toolchain cadence is the
  # effective gate.
  - wrangler
  - workerd
  - miniflare
  - '@ai-sdk/*'
  # Pi is pinned exactly (see overrides below); its release cadence is the gate.
  - '@earendil-works/*'
  # Vendor SDKs pinned exactly by @earendil-works/pi-ai; the pi release
  # cadence is the effective gate for these.
  - '@anthropic-ai/sdk'
  - '@google/genai'
  - '@mistralai/mistralai'
  - openai
  - '@aws-sdk/*'
  - '@smithy/*'
  - ai
  - protobufjs
  - react
  - react-dom
overrides:
  # Pi is pinned exactly at one release across the workspace (PI_UPGRADE_PLAN.md
  # §7 step 1). Pi packages depend on each other with caret ranges, so every
  # @earendil-works package is forced to the same version here.
  '@earendil-works/chord': 1.0.0
  '@earendil-works/pi-agent-core': 1.0.0
  '@earendil-works/pi-ai': 1.0.0
  '@earendil-works/pi-codemode': 1.0.0
  '@earendil-works/pi-durable': 1.0.0
  '@earendil-works/pi-telemetry': 1.0.0
patchedDependencies:
  # Runs pi-codemode's QuickJS VM without node:worker_threads: an injectable
  # `spawn`, the VM half as `@earendil-works/pi-codemode/vm`, and node:fs /
  # node:worker_threads imported only on first use. Shaped to go upstream
  # (earendil-works/pi packages/codemode); Code Mode runs the VM in-process
  # in the agent's Durable Object (packages/runtime/src/codemode/sandbox.ts).
  '@earendil-works/pi-codemode@1.0.0': patches/@earendil-works__pi-codemode@1.0.0.patch
